  const fmtInt = new Intl.NumberFormat('en-GB', { maximumFractionDigits: 0 });
  const fmt1 = new Intl.NumberFormat('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  function formatMoney(value) {
    if (value == null || Number.isNaN(value)) return 'N/A';
    const sign = value < 0 ? '-' : '';
    const abs = Math.abs(value);
    if (abs >= 1e12) return `${sign}${fmt1.format(abs / 1e12)}tn`;
    if (abs >= 1e9) return `${sign}${fmt1.format(abs / 1e9)}bn`;
    if (abs >= 1e6) return `${sign}${fmt1.format(abs / 1e6)}m`;
    if (abs >= 1e3) return `${sign}${fmt1.format(abs / 1e3)}k`;
    return `${sign}${fmtInt.format(abs)}`;

  function formatUsd(value) { return value == null ? 'N/A' : `$${formatMoney(value)}`; }
  function formatIntDollar(value) { if (value == null || Number.isNaN(value)) return 'N/A'; const sign = value < 0 ? '-' : ''; return `${sign}int$${formatMoney(Math.abs(value))}`; }
  function pct(value) { return value == null || Number.isNaN(value) ? 'N/A' : `${(value * 100).toFixed(1)}%`; }
  function signedPct(value) { if (value == null || Number.isNaN(value)) return 'N/A'; const sign = value > 0 ? '+' : ''; return `${sign}${(value * 100).toFixed(1)}%`; }
  function pp(value) { if (value == null || Number.isNaN(value)) return 'N/A'; const sign = value > 0 ? '+' : ''; return `${sign}${value.toFixed(1)} pp`; }

  function countryName(code) { return countryByCode.get(code)?.name || code; }
  function safeStat(pairKey, year) { return DATA.flowStats[pairKey]?.y?.[String(year)] || {v:0, p:null, m:null, status:null, gr:null, gs:null, gd:null, gp:null}; }
  function pairKey(s, r) { return `${s}|${r}`; }
  function absChange(newVal, oldVal) { return (newVal || 0) - (oldVal || 0); }
  function percentChange(newVal, oldVal) {
    if (!oldVal) return newVal ? null : 0;

  function changeLabel(newVal, oldVal) {
    const diff = absChange(newVal, oldVal);

    if (!newVal && !oldVal) return 'No change';
    const pc = percentChange(newVal, oldVal);

  function countChangeLabel(newVal, oldVal) {

    if (!o && n) return `+${fmtInt.format(diff)} from zero/N/A`;
    if (!n && !o) return 'No change';

  function formatCountryAmount(year, code, dir) {

    const av = DATA.availability[String(year)]?.[code];
    const ok = dir === 'out' ? av?.sent : av?.received;
    if (!value && !ok) return null;
    return value;
  }

  const allFlowsByYear = d3.group(DATA.flows, d => String(d.y));
  const totalsCache = new Map();
  function countryTotals(year) {
    const key = String(year);
    if (totalsCache.has(key)) return totalsCache.get(key);
    const out = new Map();
    const inc = new Map();
    for (const d of allFlowsByYear.get(key) || []) {
      out.set(d.s, (out.get(d.s) || 0) + d.v);
      inc.set(d.r, (inc.get(d.r) || 0) + d.v);

    const t = { out, inc };
    totalsCache.set(key, t);

  }
  function visibleRegionSet(region) { return REGION_FOCUS_EXCLUDE[region] || new Set(); }
  function isRegionOutlier(code, region) { return visibleRegionSet(region).has(code); }
  function filterRows() {
    const rows = allFlowsByYear.get(String(state.year)) || [];
    if (state.scope === 'regional') {
      return rows.filter(d => {
        const s = countryByCode.get(d.s), r = countryByCode.get(d.r);
        return s && r && s.region === state.region && r.region === state.region && !isRegionOutlier(d.s, state.region) && !isRegionOutlier(d.r, state.region);

    if (state.selected === 'ALL') return rows;

  }
  function lineCap() { if (state.scope === 'regional') return 220; if (state.selected === 'ALL') return 250; return 150; }
  function mappedRows(rows) { return rows.filter(d => geoCentroidByCode.has(d.s) && geoCentroidByCode.has(d.r)); }
  function selectShownRows(mappedSorted, cap, guaranteeCoverage) {
    const top = mappedSorted.slice(0, cap);
    if (!guaranteeCoverage) return top;
    // Coverage guarantee: a pure global top-N cap hides countries whose remittances are
    // spread across many individually small corridors (e.g. fragmented flows), even when
    // their total is significant. Ensure every country with a mapped corridor touches at
    // least one drawn line by adding each otherwise-missing country's single largest
    // corridor. These extras are small-value, so they render thin and faint.
    const touched = new Set();
    const shownKeys = new Set();
    for (const d of top) { touched.add(d.s); touched.add(d.r); shownKeys.add(`${d.s}|${d.r}`); }
    const bestByCode = new Map();
    for (const d of mappedSorted) {
      if (!bestByCode.has(d.s)) bestByCode.set(d.s, d);
      if (!bestByCode.has(d.r)) bestByCode.set(d.r, d);
    }
    const extra = [];
    for (const [code, d] of bestByCode) {
      if (touched.has(code)) continue;
      const k = `${d.s}|${d.r}`;
      touched.add(d.s); touched.add(d.r);
      if (shownKeys.has(k)) continue;
      shownKeys.add(k);
      extra.push(d);
    }
    return top.concat(extra);
  }

  function renderLegend() {
    const incomeItems = ['High income','Upper middle income','Lower middle income','Low income'];

  function makeCards(rows, shownRows, mappedTotal) {
    const total = d3.sum(rows, d => d.v);
    const largest = rows[0];
    const largestMeta = largest ? `${countryName(largest.s)} → ${countryName(largest.r)}` : 'No corridor';
    const shownShare = total ? d3.sum(shownRows, d => d.v) / total : 0;

      const dir = state.direction === 'outflows' ? 'out' : 'in';
      const val = formatCountryAmount(state.year, state.selected, dir);

  function baseFeaturesForFit() {
    if (state.scope !== 'regional') return worldFeatures;
    const exclude = visibleRegionSet(state.region);
    const feats = worldFeatures.filter(f => f.properties.meta?.region === state.region && !exclude.has(f.properties.meta?.code));

  function featuresToDraw() {
    if (state.scope !== 'regional') return worldFeatures;
    const exclude = visibleRegionSet(state.region);
    const feats = worldFeatures.filter(f => f.properties.meta?.region === state.region && !exclude.has(f.properties.meta?.code));
    return feats.length ? feats : worldFeatures.filter(f => f.properties.meta?.region === state.region);
  }
  function shortestAdjustedTarget(sourceLonLat, targetLonLat) {
    const lon1 = sourceLonLat[0];
    const lon2 = targetLonLat[0], lat2 = targetLonLat[1];
    const delta = ((lon2 - lon1 + 540) % 360) - 180;
    return [lon1 + delta, lat2];
  }
  function flowCurveFactor() {
    if (state.scope === 'regional') return 0.34;
    if (state.scope === 'countries' && state.selected !== 'ALL') return 0.26;
    return 0.20;
  }
  function curvedFlowPath(d, hasReverse = false) {
    // Screen-space quadratic curve between projected endpoints (house default, 16.13).
    // Produces a single smooth arc with no over-the-pole peaks or mid-path kinks, unlike
    // sampled great circles. Shortest-longitude adjustment, then the shorter screen path.
    // If both directions of the same dyad are visible, keep the lexically-first direction
    // on the existing trajectory and mirror the reverse direction so each line can be seen
    // and hovered independently.
    const s = geoCentroidByCode.get(d.s);
    const r = geoCentroidByCode.get(d.r);
    if (!s || !r) return null;
    const p0 = projection(s.lonlat);
    if (!p0) return null;
    const pRaw = projection(r.lonlat);
    const pAdj = projection(shortestAdjustedTarget(s.lonlat, r.lonlat));
    let p1 = pRaw || pAdj;
    if (pAdj && pRaw) {
      const dAdj = Math.hypot(pAdj[0] - p0[0], pAdj[1] - p0[1]);
      const dRaw = Math.hypot(pRaw[0] - p0[0], pRaw[1] - p0[1]);
      p1 = dAdj < dRaw ? pAdj : pRaw;
    }
    if (!p1) return null;
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
    const dist = Math.hypot(dx, dy);
    if (!Number.isFinite(dist) || dist < 1) return null;
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    const nx = -dy / dist, ny = dx / dist;
    const bendSide = hasReverse ? 1 : (String(d.s) < String(d.r) ? 1 : -1);
    const bend = Math.max(14, Math.min(90, dist * flowCurveFactor()));
    const cx = mx + nx * bend * bendSide, cy = my + ny * bend * bendSide;
    return `M${p0[0].toFixed(2)},${p0[1].toFixed(2)} Q${cx.toFixed(2)},${cy.toFixed(2)} ${p1[0].toFixed(2)},${p1[1].toFixed(2)}`;
  }
  function flowColour(value, maxValue) {

    return d3.interpolateRgb(lineStartByDirection[state.direction], accentByDirection[state.direction])(0.16 + 0.84 * t);
  }
  function flowOpacity(value, maxValue, range) {
    const t = Math.max(0, Math.min(1, Math.sqrt(value / Math.max(1, maxValue))));
    const lo = range ? range[0] : 0.18, hi = range ? range[1] : 0.6;
    return lo + (hi - lo) * t;
  }
  function isSmallFeature(f) {

  function isIslandSmallFeature(f) {

  function drawHighlight(code, selected=false) {

    if (selected) {
      layer.selectAll('path.selected-outline').remove();
      return;
    } else {

  function clearHoverHighlight() { if (rootG) rootG.select('.highlight-layer').selectAll('path.hover-outline').remove(); }

  function computeAutoTransform(rowsForFit, width, height) {
    if (state.scope === 'countries' && state.selected !== 'ALL') {
      const counterparties = [];
      const seen = new Set();
      const mapped = mappedRows(rowsForFit).slice().sort((a,b)=>b.v-a.v);
      for (const d of mapped) {
        const c = state.direction === 'outflows' ? d.r : d.s;
        if (!seen.has(c)) { seen.add(c); counterparties.push(c); }
      }
      const keep = Math.max(1, Math.ceil(counterparties.length * 0.8));
      const codes = new Set([state.selected, ...counterparties.slice(0, keep)]);
      const feats = Array.from(codes).map(c => featureByCode.get(c)).filter(Boolean);
      if (feats.length) {
        const fc = { type:'FeatureCollection', features: feats };
        const b = path.bounds(fc);
        const dx = Math.max(1, b[1][0] - b[0][0]);
        const dy = Math.max(1, b[1][1] - b[0][1]);
        const x = (b[0][0] + b[1][0]) / 2;
        const y = (b[0][1] + b[1][1]) / 2;
        const pad = 46;
        const scale = Math.max(1, Math.min(5.2, 0.92 / Math.max(dx / Math.max(1, width - pad*2), dy / Math.max(1, height - pad*2))));
        return d3.zoomIdentity.translate(width/2, height/2).scale(scale).translate(-x, -y);
      }
    }
    return d3.zoomIdentity;
  }
  function applyAutoZoom(transform, key, immediate=false) {
    currentAutoTransform = transform;
    if (!zoomBehavior) return;
    if (lastAutoZoomKey === key && !immediate) return;
    lastAutoZoomKey = key;
    const sel = svg.transition().duration(immediate ? 0 : (state.scope === 'countries' && state.selected !== 'ALL' ? 650 : 260)).ease(d3.easeCubicInOut);
    sel.call(zoomBehavior.transform, transform);
  }

  function openCorridorPopup(d) {
    const s = countryName(d.s), r = countryName(d.r);
    const st21 = safeStat(pairKey(d.s,d.r), '2021');
    const st24 = safeStat(pairKey(d.s,d.r), '2024');
    const chosen = safeStat(pairKey(d.s,d.r), state.year);
    const propChange = (st24.p == null || st21.p == null) ? 'N/A' : pp(st24.p - st21.p);
    const migrantNow = chosen.m == null ? 'N/A' : fmtInt.format(chosen.m);
    const migrantChange = countChangeLabel(st24.m, st21.m);
    const body = `
      <div class="popup-grid">
        <div class="popup-stat"><div class="popup-stat-label">${state.year} flow</div><div class="popup-stat-value">${formatUsd(chosen.v || 0)}</div><div class="popup-stat-note">${chosen.p == null ? 'Share N/A' : `${chosen.p.toFixed(1)}% of recipient total`}</div></div>
        <div class="popup-stat"><div class="popup-stat-label">Change, 2021–2024</div><div class="popup-stat-value">${escapeHtml(changeLabel(st24.v, st21.v))}</div><div class="popup-stat-note">Share change: ${escapeHtml(propChange)}</div></div>
        <div class="popup-stat"><div class="popup-stat-label">Migrants in source country</div><div class="popup-stat-value">${escapeHtml(migrantNow)}</div><div class="popup-stat-note">2021–2024 change: ${escapeHtml(migrantChange)}</div></div>
        <div class="popup-stat"><div class="popup-stat-label">GNI per capita gap</div><div class="popup-stat-value">${escapeHtml(formatIntDollar(chosen.gd))}</div><div class="popup-stat-note">Source minus recipient, ${escapeHtml(signedPct(chosen.gp))} of recipient GNI per capita</div></div>
      </div>
      <div class="popup-section-title">Year comparison</div>
      <div class="corridor-row"><div><div class="corridor-route">2021</div><div class="corridor-meta">${st21.p == null ? 'Share N/A' : `${st21.p.toFixed(1)}% of recipient total`} • migrants: ${st21.m == null ? 'N/A' : fmtInt.format(st21.m)}</div></div><div class="corridor-value">${formatUsd(st21.v || 0)}</div></div>
      <div class="corridor-row"><div><div class="corridor-route">2024</div><div class="corridor-meta">${st24.p == null ? 'Share N/A' : `${st24.p.toFixed(1)}% of recipient total`} • migrants: ${st24.m == null ? 'N/A' : fmtInt.format(st24.m)}</div></div><div class="corridor-value">${formatUsd(st24.v || 0)}</div></div>
    `;
    openPopup(`${s} → ${r}`, `Modelled remittance corridor`, body);
  }
  function flowRowsForCountry(code, year, dir) {
    const rows = allFlowsByYear.get(String(year)) || [];
    return rows.filter(d => dir === 'out' ? d.s === code : d.r === code).sort((a,b)=>b.v-a.v);
  }
  function corridorRowsHtml(rows, dir, limit=7) {
    const shown = rows.slice(0, limit);
    if (!shown.length) return '<div class="remaining">No corridors in this direction.</div>';
    const html = shown.map(d => {
      const other = dir === 'out' ? countryName(d.r) : countryName(d.s);
      const st21 = safeStat(pairKey(d.s,d.r), '2021');
      const st24 = safeStat(pairKey(d.s,d.r), '2024');
      const st = safeStat(pairKey(d.s,d.r), state.year);
      return `<div class="corridor-row"><div><div class="corridor-route">${escapeHtml(dir === 'out' ? `${countryName(d.s)} → ${other}` : `${other} → ${countryName(d.r)}`)}</div><div class="corridor-meta">${escapeHtml(changeLabel(st24.v, st21.v))}, 2021–2024 • migrants: ${st.m == null ? 'N/A' : fmtInt.format(st.m)}</div></div><div class="corridor-value">${formatUsd(d.v)}</div></div>`;
    }).join('');
    const rem = rows.length - shown.length;
    return html + (rem > 0 ? `<div class="remaining">${fmtInt.format(rem)} further corridors not shown.</div>` : '');
  }
  function openCountryPopup(meta) {
    const code = meta.code;
    const rec21 = formatCountryAmount('2021', code, 'in');
    const rec24 = formatCountryAmount('2024', code, 'in');
    const sent21 = formatCountryAmount('2021', code, 'out');
    const sent24 = formatCountryAmount('2024', code, 'out');
    const recNow = formatCountryAmount(state.year, code, 'in');
    const sentNow = formatCountryAmount(state.year, code, 'out');
    const mainDir = state.direction === 'outflows' ? 'out' : 'in';
    const mainRows = flowRowsForCountry(code, state.year, mainDir);
    const otherRows = flowRowsForCountry(code, state.year, mainDir === 'out' ? 'in' : 'out');
    const body = `
      <div class="popup-grid">
        <div class="popup-stat"><div class="popup-stat-label">Received, ${state.year}</div><div class="popup-stat-value">${recNow == null ? 'N/A' : formatUsd(recNow)}</div><div class="popup-stat-note">2021–2024: ${rec24 == null || rec21 == null ? 'N/A' : escapeHtml(changeLabel(rec24, rec21))}</div></div>
        <div class="popup-stat"><div class="popup-stat-label">Sent, ${state.year}</div><div class="popup-stat-value">${sentNow == null ? 'N/A' : formatUsd(sentNow)}</div><div class="popup-stat-note">2021–2024: ${sent24 == null || sent21 == null ? 'N/A' : escapeHtml(changeLabel(sent24, sent21))}</div></div>
        <div class="popup-stat"><div class="popup-stat-label">Income group</div><div class="popup-stat-value" style="font-size:13px">${escapeHtml(meta.income || 'N/A')}</div></div>
        <div class="popup-stat"><div class="popup-stat-label">Region</div><div class="popup-stat-value" style="font-size:13px">${escapeHtml(meta.region || 'N/A')}</div></div>
      </div>
      <div class="popup-section-title">Largest ${mainDir === 'out' ? 'outgoing' : 'incoming'} corridors, ${state.year}</div>
      ${corridorRowsHtml(mainRows, mainDir)}
      <div class="popup-section-title">Largest ${mainDir === 'out' ? 'incoming' : 'outgoing'} corridors, ${state.year}</div>
      ${corridorRowsHtml(otherRows, mainDir === 'out' ? 'in' : 'out', 5)}
    `;
    openPopup(meta.name, `${meta.region || 'Region N/A'} • ${meta.income || 'Income group N/A'}`, body);
  }

  function render() {
    if (!worldFeatures.length) return;
    pickerLabel.textContent = state.scope === 'regional' ? 'Region' : (state.direction === 'outflows' ? 'Source country' : 'Recipient country');
    pickerTrigger.textContent = getSelectedLabel();
    setPressed('directionToggle', 'direction', state.direction);
    setPressed('yearToggle', 'year', state.year);
    setPressed('scopeToggle', 'scope', state.scope);
    renderLegend();

    const shellWidth = Math.max(240, mapShell.clientWidth || 900);
    const isFull = document.fullscreenElement === wrapper;
    const height = isFull ? Math.max(580, Math.min(window.innerHeight - 270, 820)) : Math.max(190, Math.min(590, shellWidth * 0.56));
    svg.attr('viewBox', `0 0 ${shellWidth} ${height}`).attr('width', shellWidth).attr('height', height);
    projection = d3.geoNaturalEarth1();
    path = d3.geoPath(projection);
    const baseFc = { type:'FeatureCollection', features: baseFeaturesForFit() };
    projection.fitExtent([[16, 16], [shellWidth - 16, height - 16]], baseFc);
    path = d3.geoPath(projection);

    geoCentroidByCode = new Map();
    worldFeatures.forEach(f => {
      const meta = f.properties.meta;
      if (!meta) return;
      const c = d3.geoCentroid(f);
      geoCentroidByCode.set(meta.code, { lonlat: c, xy: projection(c), meta });
    });

    const rows = filterRows().slice().sort((a,b)=>b.v-a.v);
    const mapped = mappedRows(rows);
    const cap = lineCap();
    const guaranteeCoverage = state.selected === 'ALL' && state.scope === 'countries';
    const shownRows = selectShownRows(mapped, cap, guaranteeCoverage);
    const total = d3.sum(rows, d=>d.v);
    const maxShown = d3.max(shownRows, d=>d.v) || 1;
    renderDescriptorTabs(makeCards(rows, shownRows, mapped.length));

    const selectedName = state.scope === 'regional' ? state.region : (state.selected === 'ALL' ? 'All countries' : countryName(state.selected));
    const directionLabel = state.direction === 'outflows' ? 'outflows' : 'inflows';
    const title = state.scope === 'regional' ? `${selectedName}: intra-regional remittance corridors` : (state.selected === 'ALL' ? 'All countries: largest remittance corridors' : `${selectedName}: modelled remittance ${directionLabel}`);
    document.getElementById('panelTitle').textContent = title;
    emptyState.hidden = shownRows.length > 0;

    svg.selectAll('*').remove();
    svg.append('defs');
    svg.append('rect').attr('class', 'ocean').attr('x', 0).attr('y', 0).attr('width', shellWidth).attr('height', height)
      .on('click', function(event) {
        if (state.scope !== 'countries' || state.selected === 'ALL') return;
        if (pointerDownXY) {
          const moved = Math.hypot(event.clientX - pointerDownXY[0], event.clientY - pointerDownXY[1]);
          if (moved > 5) return; // this was a pan/drag, not a click
        }
        clearSelection();
      });
    rootG = svg.append('g').attr('class', 'zoom-root');
    const countryLayer = rootG.append('g').attr('class','countries');
    const smallOutlineLayer = rootG.append('g').attr('class','small-outline-layer');
    const highlightLayer = rootG.append('g').attr('class','highlight-layer');
    const pointLayer = rootG.append('g').attr('class','points');
    const flowLayer = rootG.append('g').attr('class','flows');
    const fDraw = featuresToDraw();

    countryLayer.selectAll('path').data(fDraw).join('path')
      .attr('class', f => {
        const meta = f.properties.meta;
        const selected = meta && state.scope === 'countries' && state.selected === meta.code;
        const muted = state.scope === 'countries' && state.selected !== 'ALL' && meta && meta.code !== state.selected;
        const small = isIslandSmallFeature(f);
        return `country${meta ? '' : ' no-meta'}${selected ? ' selected' : ''}${muted ? ' muted' : ''}${small ? ' small' : ''}`;
      })
      .attr('d', path)
      .attr('fill', f => {
        const meta = f.properties.meta;
        return meta && state.scope === 'countries' && state.selected === meta.code ? '#FFB52C' : countryFill(meta);
      })
      .attr('fill-opacity', f => {
        const meta = f.properties.meta;
        return meta && state.scope === 'countries' && state.selected === meta.code ? 0.94 : (meta ? 0.82 : 1);
      })
      .on('mouseenter', function(event, f) {
        const meta = f.properties.meta;
        if (!meta) return;
        drawHighlight(meta.code, state.selected === meta.code);
        const sent = formatCountryAmount(state.year, meta.code, 'out');
        const received = formatCountryAmount(state.year, meta.code, 'in');
        showTooltip(`<strong>${escapeHtml(meta.name)}</strong><br>${escapeHtml(meta.region || 'Region N/A')} • ${escapeHtml(meta.income || 'Income group N/A')}<br>Sent: ${sent == null ? 'N/A' : formatUsd(sent)}<br>Received: ${received == null ? 'N/A' : formatUsd(received)}<br><span style="color:#394649">Click to focus this country.</span>`, event);
      })
      .on('mousemove', moveTooltip)
      .on('mouseleave', function() { hideTooltip(); clearHoverHighlight(); if (state.scope === 'countries' && state.selected !== 'ALL') drawHighlight(state.selected, true); })
      .on('click', function(event, f) {
        const meta = f.properties.meta;
        if (state.scope !== 'countries') { if (meta) openCountryPopup(meta); return; }
        if (meta) {
          state.selected = meta.code;
          lastAutoZoomKey = '';
          closePicker();
          hideTooltip();
          render();
          openCountryPopup(meta);
        } else if (state.selected !== 'ALL') {
          // Clicked an area with no data: treat as background and clear the selection.
          clearSelection();
        }
      });

    smallOutlineLayer.selectAll('path').data(fDraw.filter(isIslandSmallFeature)).join('path').attr('class','small-outline').attr('d', path);

    const minStroke = state.selected === 'ALL' && state.scope === 'countries' ? 0.62 : 0.85;
    const maxStroke = state.selected === 'ALL' && state.scope === 'countries' ? 3.35 : (state.scope === 'regional' ? 4.7 : 5.8);
    const opRange = (state.selected === 'ALL' && state.scope === 'countries') ? [0.26, 0.72]
      : (state.scope === 'regional' ? [0.30, 0.78] : [0.32, 0.80]);
    const visibleFlowKeys = new Set(shownRows.map(d => `${d.y}|${d.s}|${d.r}`));
    const flowHoverPoints = [];
    let flowHoverTree = null;
    let activeFlowEntry = null;
    const flowGroups = flowLayer.selectAll('g.flow').data(shownRows, d => `${d.y}|${d.s}|${d.r}`).join('g').attr('class','flow');

    function flowTooltipHtml(d) {
      const key = pairKey(d.s,d.r);
      const st = safeStat(key, state.year);
      const totalShare = total ? d.v / total : null;
      return `<strong>${escapeHtml(countryName(d.s))} → ${escapeHtml(countryName(d.r))}</strong><br>${state.year} modelled remittance corridor<br><strong>${formatUsd(d.v)}</strong><br>${pct(totalShare)} of selected total${st.p == null ? '' : `<br>${st.p.toFixed(1)}% of recipient total`}<br><span style="color:#394649">Click for 2021–2024 details.</span>`;
    }

    function addHoverSamples(entry) {
      const pathNode = entry.pathNode;
      if (!pathNode || !Number.isFinite(entry.length) || entry.length <= 0) return;
      // Sample each visible line once after drawing, then use a quadtree on hover.
      // This keeps nearest-line behaviour without calling getPointAtLength() for
      // every line on every mousemove, which was the source of the lag.
      const samples = Math.max(24, Math.min(90, Math.ceil(entry.length / 10)));
      for (let i = 0; i <= samples; i++) {
        const p = pathNode.getPointAtLength((entry.length * i) / samples);
        flowHoverPoints.push({ x: p.x, y: p.y, entry });
      }
    }

    function nearestFlowFromEvent(event) {
      if (!rootG || !flowHoverTree) return null;
      const [px, py] = d3.pointer(event, rootG.node());
      const zoomK = currentViewTransform?.k || 1;
      const tolerancePx = 18;
      const nearestPoint = flowHoverTree.find(px, py, tolerancePx / zoomK);
      return nearestPoint ? nearestPoint.entry : null;
    }

    function setHoveredFlow(entry, event) {
      if (activeFlowEntry === entry) {
        if (entry) moveTooltip(event);
        return;
      }
      activeFlowEntry = entry;
      flowGroups.classed('is-hovered', false);
      if (!entry) { hideTooltip(); return; }
      d3.select(entry.groupNode).classed('is-hovered', true);
      showTooltip(flowTooltipHtml(entry.d), event);
    }

    flowGroups.each(function(d) {
      const gp = d3.select(this);
      const hasReverse = visibleFlowKeys.has(`${d.y}|${d.r}|${d.s}`);
      const linePath = curvedFlowPath(d, hasReverse);
      if (!linePath) return;
      const width = minStroke + Math.sqrt(d.v / maxShown) * (maxStroke - minStroke);
      const colour = flowColour(d.v, maxShown);
      const op = flowOpacity(d.v, maxShown, opRange);
      gp.append('path').attr('class','flow-hit').attr('d', linePath).attr('stroke-width', Math.max(44, width + 34));
      const lineNode = gp.append('path').attr('class','flow-line').attr('d', linePath).attr('stroke', colour).attr('stroke-width', width).attr('stroke-opacity', op).node();
      let length = 0;
      try { length = lineNode.getTotalLength(); } catch(e) { length = 0; }
      const entry = { d, groupNode: this, pathNode: lineNode, length };
      addHoverSamples(entry);
    });
    if (flowHoverPoints.length) {
      flowHoverTree = d3.quadtree().x(p => p.x).y(p => p.y).addAll(flowHoverPoints);
    }
    flowGroups
      .on('mouseenter', function(event) { setHoveredFlow(nearestFlowFromEvent(event), event); })
      .on('mousemove', function(event) { setHoveredFlow(nearestFlowFromEvent(event), event); })
      .on('mouseleave', function(event) { setHoveredFlow(null, event); })
      .on('click', function(event) {
        const nearest = nearestFlowFromEvent(event);
        if (nearest) openCorridorPopup(nearest.d);
      });

    if (state.scope === 'countries' && state.selected !== 'ALL') {
      drawHighlight(state.selected, true);
    }

    zoomBehavior = d3.zoom().scaleExtent([1, 9]).translateExtent([[-shellWidth * 1.5, -height * 1.5], [shellWidth * 2.5, height * 2.5]]).on('zoom', event => { if (rootG) rootG.attr('transform', event.transform); currentViewTransform = event.transform; });
    svg.call(zoomBehavior).on('dblclick.zoom', null);
    document.getElementById('zoomIn').onclick = () => svg.transition().duration(180).call(zoomBehavior.scaleBy, 1.35);
    document.getElementById('zoomOut').onclick = () => svg.transition().duration(180).call(zoomBehavior.scaleBy, 1/1.35);
    document.getElementById('zoomReset').onclick = () => { currentViewTransform = currentAutoTransform; lastViewContextKey = `${state.scope}|${state.region}|${state.selected}|${shellWidth}|${height}`; svg.transition().duration(260).ease(d3.easeCubicInOut).call(zoomBehavior.transform, currentAutoTransform); };
    const viewContextKey = `${state.scope}|${state.region}|${state.selected}|${shellWidth}|${height}`;
    const autoTransform = computeAutoTransform(mapped, shellWidth, height);
    currentAutoTransform = autoTransform;
    if (lastViewContextKey === viewContextKey) {
      svg.call(zoomBehavior.transform, currentViewTransform);
    } else {
      lastViewContextKey = viewContextKey;
      currentViewTransform = autoTransform;
      svg.transition().duration(state.scope === 'countries' && state.selected !== 'ALL' ? 650 : 260).ease(d3.easeCubicInOut).call(zoomBehavior.transform, autoTransform);
    }
  }

  async function init() {
    try {
      const world = CGD_WORLD_ATLAS;
      worldFeatures = topojson.feature(world, world.objects.countries).features
        .filter(f => String(f.id).padStart(3, '0') !== '010')
        .map(f => {
          const id = String(f.id).padStart(3, '0');
          f.properties = f.properties || {};
          f.properties.m49 = id;
          f.properties.meta = countriesByM49.get(id) || null;
          return f;
        });
      featureByCode = new Map(worldFeatures.filter(f => f.properties.meta).map(f => [f.properties.meta.code, f]));
      render();
    } catch (err) {
      console.error(err);
      emptyState.hidden = false;
      emptyState.textContent = 'The map geometry could not be loaded. Reload the page; if it persists, the figure needs attention.';
      renderDescriptorTabs([
        {title:'2024 total', value:`$${formatMoney(Number(DATA.totalsByYear['2024'] || 0))}`, context:'modelled corridors', accent:'#0B4C5B'},
        {title:'2021 total', value:`$${formatMoney(Number(DATA.totalsByYear['2021'] || 0))}`, context:'modelled corridors', accent:'#85A5AD'},
        {title:'Flows loaded', value:`${fmtInt.format(DATA.flows.length)}`, context:'corridors', accent:'#FFB52C'}
      ]);
    }
  }
  window.addEventListener('resize', () => window.requestAnimationFrame(() => { lastAutoZoomKey = ''; render(); }));
  init().then(function () {
    window.cgdRendered = true;
    document.dispatchEvent(new Event('cgd:rendered'));
  });
})();
</script>
