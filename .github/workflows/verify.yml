name: verify figures

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        # Pinned to the version the audit was actually verified against. A
        # different Chromium can shift text metrics by a fraction of a pixel,
        # which is enough to flip a clipping or overlap check — so bump this
        # deliberately and re-run qa/audit.py locally at the same version.
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Audit every figure
        run: python qa/audit.py --shots qa/shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure-screenshots
          path: qa/shots
          if-no-files-found: warn
